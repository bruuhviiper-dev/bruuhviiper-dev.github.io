<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bruno Diresta — Aplicativos Android</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e2a4a 0%, #3a2a5a 100%);
      color: #fff; padding: 24px;
    }
    .card {
      max-width: 560px; width: 100%; text-align: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px; padding: 40px 28px;
      backdrop-filter: blur(8px);
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 8px 0 0; opacity: 0.85; line-height: 1.5; }
    .links { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    a.btn {
      display: block; text-decoration: none; color: #fff;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      padding: 14px 18px; border-radius: 12px; font-weight: 600;
      transition: background .2s;
    }
    a.btn:hover { background: rgba(255,255,255,0.20); }
    footer { margin-top: 24px; font-size: 0.8rem; opacity: 0.6; }
    a.mail { color: #9fb8ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Bruno Diresta</h1>
    <p>Desenvolvimento de aplicativos Android úteis e de entretenimento para o público de língua portuguesa, distribuídos pela Google Play.</p>
    <div class="links">
      <a class="btn" href="./politicas/">Políticas de Privacidade dos apps</a>
    </div>
    <footer>
      Contato: <a class="mail" href="mailto:nojacursos@gmail.com">nojacursos@gmail.com</a>
    </footer>
  </div>
</body>
</html>
